<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lidar Test - Projet AGV</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="navbar">
      <div class="brand">
        <span class="brand-title">Projet AGV</span>
        <span class="brand-subtitle">Chaîne de production automatisée</span>
      </div>
      <nav aria-label="Navigation principale">
        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="index.html#equipe">Équipe</a></li>
          <li><a href="_CdCF%20-%20Projet%20AGV%20.docx.pdf" target="_blank" rel="noopener">Cahier des charges</a></li>
          <li><a href="materiel.html">Matériel</a></li>
          <li><a href="projet-final.html" aria-current="page">Document technique</a></li>
          <li><a href="simulateur/index.html">Simulateur AGV</a></li>
        </ul>
      </nav>
      <div class="nav-cta">
        <a href="projet-final.html" class="btn btn-sm">
          <i class="fa-solid fa-diagram-project" aria-hidden="true"></i>
          <span>Voir le projet</span>
        </a>
        <a href="simulateur/index.html" class="btn btn-sm secondary">
          <i class="fa-solid fa-robot" aria-hidden="true"></i>
          <span>Simulateur</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-5">
    <div class="text-center mb-4">
      <h1>Photo Lidar Test</h1>
      <p class="text-muted">Résultat des tests Lidar du projet AGV.</p>
    </div>

    <div class="d-flex justify-content-center">
      <figure class="text-center">
        <img
          id="lidar-test-image"
          src="lidar test.png"
          alt="Photo des tests Lidar"
          data-fallback-base="lidar test"
          class="img-fluid rounded shadow-sm"
          style="max-height: 75vh;"
        >
        <figcaption class="mt-3 text-muted">Lidar Test</figcaption>
      </figure>
    </div>
  </main>

  <footer class="text-center py-3">
    <p class="mb-0">Projet AGV - Chaîne de Production</p>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const image = document.getElementById('lidar-test-image');
      if (!image) return;

      const baseName = image.getAttribute('data-fallback-base');
      const candidates = [
        `${baseName}.png`,
        `${baseName}.jpg`,
        `${baseName}.jpeg`,
        `${baseName}.webp`,
        baseName
      ];
      let currentIndex = 0;

      image.onerror = () => {
        currentIndex += 1;
        if (currentIndex < candidates.length) {
          image.src = candidates[currentIndex];
        }
      };
      image.src = candidates[currentIndex];
    });
  </script>
</body>
</html>
